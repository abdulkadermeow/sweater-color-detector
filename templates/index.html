<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>prototype abdul</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Tahoma, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
            padding: 24px;
            max-width: 760px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #1e3c72;
            font-size: 26px;
            margin-bottom: 6px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 16px;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
        }

        .video-wrapper img {
            width: 100%;
            display: block;
        }

        .hint {
            margin-top: 14px;
            color: #444;
            font-size: 14px;
            line-height: 1.8;
        }

        .badge {
            display: inline-block;
            background: #eef3fb;
            color: #1e3c72;
            border-radius: 20px;
            padding: 4px 14px;
            font-size: 13px;
            margin-top: 10px;
        }

        .footer {
            margin-top: 16px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        

        <div class="video-wrapper">
            <!-- بث الفيديو القادم من الخادم (Flask + OpenCV) -->
            <img src="/video_feed" alt="بث الكاميرا">
        </div>

        
        

        
    </div>
</body>
</html>
